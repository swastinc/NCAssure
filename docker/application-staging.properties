# Deployment defaults only. Credentials come from runtime environment variables.
spring.application.name=QAPortal

azuread.client-id=${AZUREAD_CLIENT_ID}
azuread.client-secret=${AZUREAD_CLIENT_SECRET}
azuread.tenant-id=${AZUREAD_TENANT_ID}
azuread.audience=api://${AZUREAD_CLIENT_ID}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZUREAD_TENANT_ID}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=api://${AZUREAD_CLIENT_ID}
azure.ad.group-id=${AZURE_AD_GROUP_ID}

oauth.scope=499b84ac-1321-427f-aa17-267ca6975798/.default
ado.scope=499b84ac-1321-427f-aa17-267ca6975798/.default
ado.scopeuser=user_impersonation
ado.scopedefault=.default
graph.scopeuser=User.Read openid profile offline_access

server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.forward-headers-strategy=native

ado.org=${VITE_ORGANIZATION:NC-QA}
ado.base-url=https://dev.azure.com/${ado.org}
ado.api-version=7.1
ado.resource=499b84ac-1321-427f-aa17-267ca6975798
azure.base-url=https://dev.azure.com/${ado.org}/_apis/projects?api-version=7.1
azure.webhooks.subscriptions-url=https://dev.azure.com/${ado.org}/_apis/hooks/subscriptions?api-version=7.1
azure.webhooks.target-url=${AZURE_DEVOPS_WEBHOOK_URL}
azure.webhooks.event-type=workitem.created
azure.webhooks.auto-create-enabled=true
qaportal.webhook.secret=${QAPORTAL_WEBHOOK_SECRET}
jsonplaceholder.base-url=https://jsonplaceholder.typicode.com

spring.cloud.azure.cosmos.endpoint=${AZURE_COSMOS_ENDPOINT:}
spring.cloud.azure.cosmos.key=${AZURE_COSMOS_KEY:}
spring.cloud.azure.cosmos.database=QAPORTAL
spring.cloud.azure.cosmos.connection-mode=GATEWAY
spring.cloud.azure.cosmos.populate-query-metrics=true

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true

spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY}
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT}
spring.ai.azure.openai.chat.options.deployment-name=${AZURE_OPENAI_CHAT_DEPLOYMENT}
spring.ai.azure.openai.chat.options.max-completion-tokens=2000
spring.ai.azure.openai.chat.options.temperature=1
spring.ai.azure.openai.embedding.options.deployment-name=${AZURE_OPENAI_EMBED_DEPLOYMENT}
spring.ai.azure.openai.embedding.options.dimensions=1024

spring.ai.vectorstore.type=azure
spring.ai.vectorstore.azure.url=https://ncassurevectorsearch.search.windows.net
spring.ai.vectorstore.azure.api-key=${AZURE_AI_SEARCH_API_KEY}
spring.ai.vectorstore.azure.index-name=${AZURE_AI_SEARCH_INDEX_NAME:spring_ai_azure_vector_store}
spring.ai.vectorstore.azure.initialize-schema=${AZURE_AI_SEARCH_INITIALIZE_SCHEMA:false}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
